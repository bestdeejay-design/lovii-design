
  <script>
    /* ============ Механика темы — канон docs/05-theming ============ */
    const THEME_KEY = 'lovii_theme';

    /* ============ Канон — единственный источник значений ============
       Свотчи, демо-точки тем и meta theme-color читают значения прямо из
       инлайннутого tokens.css (см. шапку страницы). Копировать значения
       токенов в этот файл запрещено — железное правило 13 (AGENTS.md),
       страж: python3 tools/check-sync.py. */
    const TOKEN_CSS = (function () {
      for (const st of document.querySelectorAll('style')) {
        if (st.textContent.indexOf('--lv-bg:') !== -1) return st.textContent;
      }
      return '';
    })();

    function parseTokenBuckets(css) {
      const buckets = { light: {}, dark: {} };
      const text = css.replace(/\/\*[\s\S]*?\*\//g, '');
      const blockRe = /([^{}]+)\{([^{}]*)\}/g;
      let b;
      while ((b = blockRe.exec(text))) {
        const sel = b[1];
        const bucket = sel.indexOf('data-theme="dark"') !== -1 ? 'dark' : (sel.indexOf(':root') !== -1 ? 'light' : null);
        if (!bucket) continue;
        const declRe = /(--lv-[a-z0-9-]+)\s*:\s*([^;]+);/g;
        let d;
        while ((d = declRe.exec(b[2]))) buckets[bucket][d[1]] = d[2].trim();
      }
      return buckets;
    }
    const TOK = parseTokenBuckets(TOKEN_CSS);
    function tokVal(bucket, name) { return (TOK[bucket] && TOK[bucket][name]) || TOK.light[name] || ''; }

    const THEME_META = { light: tokVal('light', '--lv-meta-light'), dark: tokVal('light', '--lv-meta-dark') };
    function currentTheme() {
      return document.documentElement.dataset.theme === 'dark' ? 'dark' : 'light';
    }
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      const meta = document.getElementById('meta-theme');
      if (meta) meta.setAttribute('content', THEME_META[t]);
    }
    function toggleTheme() {
      const t = currentTheme() === 'dark' ? 'light' : 'dark';
      try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
      applyTheme(t);
      toast(t === 'dark' ? 'Тёмная тема включена' : 'Светлая тема включена');
    }

    /* ============ Свотчи палитры ============
       Здесь заданы только ИМЕНА (API токенов). Значения парсятся из канона:
       брендовые и светлая тема — из :root, тёмная — из [data-theme="dark"]. */
    const BRAND_NAMES = [
      '--lv-pink', '--lv-pink-dark', '--lv-tiffany', '--lv-gold', '--lv-sand',
      '--lv-gradient-brand', '--lv-gradient-ink',
    ];
    const THEME_NAMES = [
      '--lv-ink', '--lv-dim',
      '--lv-bg', '--lv-page', '--lv-card', '--lv-surface', '--lv-glass', '--lv-on-brand',
      '--lv-line', '--lv-line-2', '--lv-hairline',
      '--lv-soft-pink', '--lv-mist-pink', '--lv-soft-tiffany', '--lv-soft-gold',
      '--lv-sand-soft', '--lv-grey-soft',
      '--lv-gold-text', '--lv-tiffany-text', '--lv-green-text', '--lv-green-soft',
      '--lv-hero-top', '--lv-kpi-soft',
    ];
    function swatch(el, names, bucket) {
      el.innerHTML = names.map((name) => {
        const v = tokVal(bucket, name);
        const grad = v.indexOf('gradient(') !== -1;
        return `
        <div class="sw">
          <div class="chip" style="background:${v || 'transparent'}"></div>
          <div class="info"><div class="nm">${name}</div><div class="hx">${grad ? 'gradient' : v}</div></div>
        </div>`;
      }).join('');
    }
    swatch(document.getElementById('sw-brand'), BRAND_NAMES, 'light');
    swatch(document.getElementById('sw-light'), THEME_NAMES, 'light');
    swatch(document.getElementById('sw-dark'), THEME_NAMES, 'dark');

    /* Демо-точки тем: фон приходит из канона (data-token-dot="тема:--lv-имя") */
    document.querySelectorAll('[data-token-dot]').forEach((el) => {
      const scope = el.getAttribute('data-token-dot').split(':');
      const v = tokVal(scope[0], scope[1]);
      if (v) el.style.background = v;
    });

    /* ============ Шит ============ */
    const overlay = document.getElementById('sheet-overlay');
    const sheet = document.getElementById('demo-sheet');
    function openSheet() { overlay.classList.add('open'); sheet.classList.add('open'); }
    function closeSheet() { overlay.classList.remove('open'); sheet.classList.remove('open'); }
    overlay.addEventListener('click', closeSheet);
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeSheet(); });
    sheet.querySelectorAll('.district-row').forEach((row) => {
      row.addEventListener('click', () => {
        sheet.querySelectorAll('.district-row').forEach((r) => r.classList.remove('active'));
        row.classList.add('active');
        closeSheet();
        toast('Район выбран: ' + row.querySelector('.nm').textContent, 'Покажем точки в шаговой доступности');
      });
    });

    /* ============ Тосты ============ */
    function toast(text, d) {
      const wrap = document.getElementById('toast-wrap');
      const el = document.createElement('div');
      el.className = 'toast';
      el.innerHTML = text + (d ? `<span class="d">${d}</span>` : '');
      wrap.appendChild(el);
      setTimeout(() => { el.classList.add('hide'); setTimeout(() => el.remove(), 260); }, 2400);
    }

    /* ============ Кнопки действий ============ */
    document.querySelector('[data-action="theme-toggle"]').addEventListener('click', toggleTheme);
    document.querySelector('[data-action="open-sheet"]').addEventListener('click', openSheet);
    document.querySelector('[data-action="show-toast"]').addEventListener('click', () => toast('Товар добавлен в корзину', 'Молочная лавка · самовывоз через 15 минут'));
    document.querySelector('[data-action="replay-enter"]').addEventListener('click', () => {
      const t = document.querySelector('.lv-enter-target');
      t.classList.remove('lv-enter'); void t.offsetWidth; t.classList.add('lv-enter');
    });
  </script>

<script src="assets/nav.js" defer></script>
</body>
</html>
